name: Build APK

# 说明
# ----
# GitHub 的 ubuntu runner 自带 Android SDK（$ANDROID_HOME），
# 所以不用 android-actions/setup-android（它经常在这个步骤失败）。
# 只需要确认 platform 34 / build-tools 34 存在，缺了就补装。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 也可以在网页上手动触发

jobs:
  build:
    # 固定 22.04：SDK 预装内容比 ubuntu-latest 稳定，避免镜像更新导致路径变化
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认/安装 Android SDK 组件
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::runner 上找不到 Android SDK 目录"
            exit 1
          fi
          echo "SDK 目录: $SDK"
          ls "$SDK" | head -20

          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager 可执行文件"
            find "$SDK" -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          # 已存在就不重复装；缺什么补什么
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

          echo "--- 安装后检查 ---"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: rbmk-1000-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 完成提示
        run: echo "构建完成 —— 到本页 Artifacts 区域下载 rbmk-1000-debug-apk"
